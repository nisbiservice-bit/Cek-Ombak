<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for icon container -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <!-- Deep Blue Wave Outer Crest -->
    <linearGradient id="deepWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <!-- Cyan Ocean Wave -->
    <linearGradient id="cyanWaveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <!-- Emerald Green Wave (Cénghar) -->
    <linearGradient id="greenWaveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <!-- Golden Amber Sun -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Circular Base Mask / Container -->
  <g transform="translate(0, 0)">
    <!-- Golden Sun with Glow -->
    <circle cx="350" cy="220" r="46" fill="url(#sunGrad)" filter="url(#sunGlow)"/>
    <!-- Outer Swirling Wave Crest (forming stylized "C") -->
    <path d="M 440 180 C 430 110, 370 50, 270 50 C 150 50, 60 145, 60 265 C 60 325, 80 375, 120 415 C 95 365, 85 305, 100 240 C 120 155, 185 95, 275 95 C 345 95, 395 135, 420 185 C 430 185, 435 182, 440 180 Z"
          fill="url(#deepWaveGrad)"/>
    <!-- Upper Cyan Crest Wrap -->
    <path d="M 440 180 C 420 100, 350 70, 270 70 C 180 70, 115 130, 95 210 C 120 150, 180 110, 260 110 C 330 110, 390 145, 415 205 C 430 195, 436 188, 440 180 Z"
          fill="url(#cyanWaveGrad)" opacity="0.95"/>
    <!-- Green Horizon / Cénghar Crest Wave -->
    <path d="M 75 320 C 120 280, 180 250, 250 250 C 330 250, 390 310, 475 285 C 445 340, 370 360, 310 330 C 235 295, 150 330, 85 370 C 80 350, 76 335, 75 320 Z"
          fill="url(#greenWaveGrad)"/>
    <!-- Foreground Ocean Swell (Navy to Blue) -->
    <path d="M 85 370 C 150 320, 230 290, 310 330 C 370 360, 425 345, 465 315 C 455 385, 400 450, 310 470 C 215 490, 130 450, 85 370 Z"
          fill="url(#deepWaveGrad)"/>
    <!-- Bottom Light Blue Surging Wave with White Foam Line -->
    <path d="M 88 385 C 160 340, 240 340, 310 375 C 375 410, 425 395, 455 355 C 435 430, 360 475, 275 475 C 190 475, 120 435, 88 385 Z"
          fill="url(#cyanWaveGrad)"/>
    <!-- White Wave Foam Accent 1 -->
    <path d="M 98 375 C 165 330, 245 335, 315 370 C 370 400, 420 390, 450 360"
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <!-- White Wave Foam Accent 2 -->
    <path d="M 125 420 C 190 380, 260 385, 320 415 C 365 440, 400 430, 425 410"
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
